# CI (replaces .github/workflows/ci.yml, 27 Oct 2026): every branch push except staging and
# gh-pages (staging runs cloudbuild.yaml), including main, and pull requests. Node 20.
steps:
  - id: install
    name: node:20
    entrypoint: npm
    args: ['ci']
  - id: typecheck
    name: node:20
    entrypoint: npm
    args: ['run', 'typecheck']
    waitFor: ['install']
  - id: lint
    name: node:20
    entrypoint: npm
    args: ['run', 'lint']
    waitFor: ['install']
  - id: unit
    name: node:20
    entrypoint: npm
    args: ['test']
    waitFor: ['install']
  - id: build
    name: node:20
    entrypoint: bash
    waitFor: ['typecheck', 'lint', 'unit']
    args:
      - -ec
      - |
        # production URLs, for the bundle size + lint check
        npm run build
        node scripts/check-size.mjs
  # Rebuild with the mock-server URLs baked in. The production bundle points at
  # embed.vocadesk.com / voice.vocadesk.com, which the e2e environment can't reach; the test
  # mock server runs on 127.0.0.1.
  - id: e2e
    name: node:20
    entrypoint: bash
    waitFor: ['build']
    env:
      - VITE_API_URL=http://127.0.0.1:8799
      - VITE_WSS_URL=ws://127.0.0.1:8788/embed/v1/call
    args:
      - -ec
      - |
        # apt dependencies live in the container, so install and run in the same step
        npx playwright install --with-deps chromium
        npm run build
        npm run e2e
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
