name: Deploy embed-cdn.callcat.ai proxy

# embed-cdn.callcat.ai is a Cloudflare Worker route (callcat.ai zone, already
# on Cloudflare) that forwards every request to cdn.vocadesk.com - same idiom
# as docs.callcat.ai (vocadesk-docs/cloudflare/docs-proxy). GitHub Pages
# (gh-pages branch, published by release.yml) stays the single source of the
# versioned bundles; nothing is duplicated.

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/embed-cdn-proxy/**"
      - ".github/workflows/deploy-cloudflare-proxy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/embed-cdn-proxy
          command: deploy
